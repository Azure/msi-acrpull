name: Azure Workload Identity E2E

on:
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  msi_acrpull_e2e:
    env:
      AZURE_CLIENT_ID: ecf12de5-b661-4194-8c94-3710b7d5472f
      AZURE_TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
      AZURE_SUBSCRIPTION_ID: 0cc1cafa-578f-4fa5-8d6b-ddfd8d82e6ea
      UNIQUE_INPUT: '${{ github.base_ref }}-${{ github.head_ref }}-${{ github.job }}-${{ github.run_id }}'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          check-latest: true
      - name: Azure CLI
        run: |
          echo "Azure CLI Current installed version"
          az version
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Setup infrastructure
        run: make -C test/ _output/infrastructure.json _output/aks.kubeconfig _output/deploy/prometheus-crds _output/system-vmss-puller.json _output/tenant "UNIQUE_INPUT=${UNIQUE_INPUT}"
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        name: Refresh Azure login before ACR build
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push controller image
        run: make -C test/ _output/image.json "UNIQUE_INPUT=${UNIQUE_INPUT}"
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        name: Refresh Azure login before test image imports
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
        # Refresh OIDC assertion so ACR commands in test targets succeed
      - name: E2E test
        run: make -C test/ test "UNIQUE_INPUT=${UNIQUE_INPUT}"
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        name: Refresh Azure login before cleanup
        if: ${{ always() }}
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Cleanup
        if: ${{ always() }}
        run: make -C test/ cleanup "UNIQUE_INPUT=${UNIQUE_INPUT}"